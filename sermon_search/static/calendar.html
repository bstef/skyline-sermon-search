<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline · Sermon Calendar</title><link rel="preload" href="/static/fonts/InstrumentSans-Variable.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="/static/fonts/InstrumentSerif-Regular.ttf" as="font" type="font/ttf" crossorigin><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/style.css"><script src="/static/player.js" defer></script><script src="/static/calendar.js" defer></script></head>
<body>
<header><a class="brand" href="/" aria-label="Skyline sermon search home"><img class="brand-logo logo-light" src="/static/skyline-logo-light.png" alt="Skyline Church" width="190" height="58"><img class="brand-logo logo-dark" src="/static/skyline-logo-dark.png" alt="Skyline Church" width="190" height="58"></a><div class="header-actions"><a class="church-link" href="https://www.skylinechurchnj.org/watch" target="_blank" rel="noopener">Visit Skyline ↗</a><button id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.2A8.8 8.8 0 0 1 10.8 3.4 8.8 8.8 0 1 0 20.6 13.2Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></div></header><nav class="site-nav" aria-label="Main navigation"><a href="/">Search sermons</a><a href="/calendar" aria-current="page">Calendar</a></nav>
<main class="calendar-page">
<section class="calendar-intro"><div class="eyebrow">THE SERMON ARCHIVE</div><h1>A message for <em>every season.</em></h1><p>Browse Skyline’s sermons by date. Choose a view and return to a message.</p></section>
<section aria-label="Sermon calendar">
<div class="calendar-toolbar"><div class="period-navigation"><button id="previous" aria-label="Previous period">←</button><h2 id="period-title">Loading calendar…</h2><button id="next" aria-label="Next period">→</button></div><div class="calendar-controls"><button id="today">Today</button><label class="jump-label">Jump to date<input type="date" id="jump-date" min="1900-01-01" max="2100-12-31"></label></div></div>
<div class="calendar-subtoolbar"><div class="view-switcher" role="group" aria-label="Calendar view"><button data-view="month" aria-pressed="true">Month</button><button data-view="week" aria-pressed="false">Week</button><button data-view="agenda" aria-pressed="false">Agenda</button></div><span id="calendar-count"></span></div>
<p id="calendar-status" role="status" aria-live="polite"></p><div id="calendar-content"></div>
<section id="day-details" aria-labelledby="day-title"><div class="section-heading"><h2 id="day-title">Select a date</h2><span id="day-count"></span></div><div id="day-sermons"></div></section>
</section>
<footer><span>Skyline Church · Bloomfield, NJ</span><span>Made for the moments you want to revisit.</span></footer>
</main><aside id="player-panel" hidden><div><span class="eyebrow">NOW LISTENING</span><strong id="player-title"></strong><span id="player-status" role="status"></span></div><audio id="player" controls preload="none"></audio><button id="close-player" aria-label="Close player">✕</button></aside>
</body></html>
